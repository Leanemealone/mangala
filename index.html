<script>
    const firebaseConfig = { apiKey: "AIzaSyDcsk1VzI78PnMYeGvvY9CoLoiLxXl-4VQ", projectId: "mangala-a967f", databaseURL: "https://mangala-a967f-default-rtdb.europe-west1.firebasedatabase.app", appId: "1:501041787727:web:f6a56b97c4415397078b3a" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();
    const rtdb = firebase.database();
    const clickSound = new Audio('https://raw.githubusercontent.com/Leanemealone/assets-images/refs/heads/main/tas_sesi.mp3');

    let board = [4, 4, 4, 4, 4, 4, 0, 4, 4, 4, 4, 4, 4, 0];
    let isPlayer1Turn = true;
    let currentUser = null;
    let opponentName = "Bilgisayar"; 
    let myRole = ""; 
    let currentRoomRef = null;
    let gameMode = "";
    let isAnimating = false;
    let isHandActive = false;
    let lastProcessedMoveTs = 0;
    let gameFinished = false;
    let resultBoxTimer = null;
    let resultBoxResolver = null;
    let turnStartedAt = 0;
    let matchStats = null;
    let lastPresenceSnapshot = null;
    let studentsData = {};
    const sessionId = "sess_" + Math.random().toString(36).slice(2) + Date.now();
    const audioCtx = window.AudioContext ? new AudioContext() : null;

    function enterFullscreen() {
        const root = document.documentElement;
        const request = root.requestFullscreen || root.webkitRequestFullscreen || root.msRequestFullscreen;
        if (request) { request.call(root).catch(() => {}); }
    }

    function updateHandPos(e) { 
        if (!isHandActive) return; 
        const hand = document.getElementById('hand');
        let x = (e.type.includes('touch')) ? e.touches[0].clientX : e.clientX; 
        let y = (e.type.includes('touch')) ? e.touches[0].clientY : e.clientY; 
        hand.style.display = "block";
        hand.style.left = x + 'px'; hand.style.top = y + 'px'; 
    }
    window.addEventListener('mousemove', updateHandPos); 
    window.addEventListener('touchstart', updateHandPos); 
    window.addEventListener('touchmove', updateHandPos);

    function getPlayerNames() {
        const p1Name = (gameMode === "ONLINE" && myRole === "p2") ? opponentName : currentUser.ad_soyad;
        const p2Name = (gameMode === "ONLINE" && myRole === "p2") ? currentUser.ad_soyad : opponentName;
        return { p1Name, p2Name };
    }

    function resetMatchStats() {
        const names = getPlayerNames();
        matchStats = {
            moves: {},
            fastest: { player: "", ms: Number.POSITIVE_INFINITY },
            bestGain: { player: "", stones: 0 },
            names: names
        };
        matchStats.moves[names.p1Name] = { count: 0, totalMs: 0 };
        matchStats.moves[names.p2Name] = { count: 0, totalMs: 0 };
        turnStartedAt = Date.now();
    }

    function ensurePlayerInStats(name) {
        if (!matchStats) resetMatchStats();
        if (!matchStats.moves[name]) matchStats.moves[name] = { count: 0, totalMs: 0 };
    }

    function recordMoveStats(playerName, gainedStones) {
        ensurePlayerInStats(playerName);
        const elapsed = Math.max(0, Date.now() - turnStartedAt);
        matchStats.moves[playerName].count += 1;
        matchStats.moves[playerName].totalMs += elapsed;
        if (elapsed > 0 && elapsed < matchStats.fastest.ms) {
            matchStats.fastest = { player: playerName, ms: elapsed };
        }
        if (gainedStones > matchStats.bestGain.stones) {
            matchStats.bestGain = { player: playerName, stones: gainedStones };
        }
        turnStartedAt = Date.now();
    }

    function buildMatchSummary(winnerText) {
        if (!matchStats) return "";
        const fastest = matchStats.fastest.ms === Number.POSITIVE_INFINITY
            ? "En hizli hamle: -"
            : "En hizli hamle: " + matchStats.fastest.player + " (" + (matchStats.fastest.ms / 1000).toFixed(1) + " sn)";
        const bestGain = matchStats.bestGain.stones > 0
            ? "En cok tas: " + matchStats.bestGain.player + " (+" + matchStats.bestGain.stones + ")"
            : "En cok tas: -";
        let starName = "";
        if (winnerText && winnerText.includes("kazandı")) {
            starName = winnerText.replace(" kazandı", "");
        } else if (matchStats.fastest.player) {
            starName = matchStats.fastest.player;
        } else {
            starName = currentUser ? currentUser.ad_soyad : "Bugunun Oyuncusu";
        }
        return fastest + "\n" + bestGain + "\nBugunun yildizi: " + starName;
    }

    function updateTeacherPanelFromPresence(presenceData) {
        const online = presenceData ? Object.values(presenceData) : [];
        const names = online
            .map(v => v && v.userName ? v.userName : "")
            .filter(Boolean)
            .slice(0, 8);
        const onlineEl = document.getElementById('tm-online');
        const namesEl = document.getElementById('teacher-online-names');
        if (onlineEl) onlineEl.innerText = String(online.length);
        if (namesEl) namesEl.innerText = "Oyuncular: " + (names.length ? names.join(", ") : "-");
    }

    function showOnboardingIfNeeded() {
        if (!currentUser) return;
        const key = "mangala_tour_seen_" + currentUser.id;
        if (localStorage.getItem(key) === "1") return;
        const overlay = document.getElementById('onboarding-overlay');
        const stepEl = document.getElementById('onboarding-step');
        const textEl = document.getElementById('onboarding-text');
        const nextBtn = document.getElementById('onboarding-next-btn');
        const skipBtn = document.getElementById('onboarding-skip-btn');
        if (!overlay || !stepEl || !textEl || !nextBtn || !skipBtn) return;
        const steps = [
            "Kendi tarafindaki dolu kuyulardan birine dokunarak hamle yap.",
            "Her hamlede taslar saga dogru dagilir. Hazinene gelen taslar puandir.",
            "Oyun bitince sonucu gor, istersen tekrar oyna veya menuye don."
        ];
        let idx = 0;
        const render = () => {
            stepEl.innerText = "Adim " + (idx + 1) + "/" + steps.length;
            textEl.innerText = steps[idx];
            nextBtn.innerText = idx === steps.length - 1 ? "Basla" : "Devam";
        };
        const close = () => {
            overlay.style.display = 'none';
            localStorage.setItem(key, "1");
        };
        nextBtn.onclick = () => {
            if (idx < steps.length - 1) {
                idx++;
                render();
            } else close();
        };
        skipBtn.onclick = close;
        render();
        overlay.style.display = 'flex';
    }

    function getBadgeLabel(totalScore) {
        if (totalScore >= 800) return "Sampiyon";
        if (totalScore >= 350) return "Usta";
        return "Baslangic";
    }

    function updateUserLabel() {
        if (!currentUser) return;
        const total = (currentUser.skor_ai || 0) + (currentUser.skor_online || 0);
        const badge = getBadgeLabel(total);
        document.getElementById('user-label').innerText = "Sen: " + currentUser.ad_soyad + " [" + badge + "]";
    }

    function playTone(freq, durationMs, type = "sine", gain = 0.04) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const g = audioCtx.createGain();
        osc.type = type; osc.frequency.value = freq;
        g.gain.value = gain;
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start();
        setTimeout(() => osc.stop(), durationMs);
    }

    function playTurnDing() {
        playTone(880, 90, "triangle", 0.045);
    }

    function playEndJingle(isDraw) {
        if (isDraw) {
            playTone(660, 120, "sine", 0.035);
            setTimeout(() => playTone(740, 120, "sine", 0.035), 120);
            return;
        }
        playTone(740, 120, "triangle", 0.04);
        setTimeout(() => playTone(880, 120, "triangle", 0.04), 120);
        setTimeout(() => playTone(1046, 170, "triangle", 0.04), 250);
    }

    function createFxBurst(type) {
        const layer = document.getElementById('fx-layer');
        if (!layer) return;
        const items = type === "draw" ? ["⭐", "✨"] : ["🎉", "✨", "🎊"];
        const count = type === "draw" ? 26 : 34;
        for (let i = 0; i < count; i++) {
            const p = document.createElement('div');
            p.className = 'fx-particle';
            p.innerText = items[Math.floor(Math.random() * items.length)];
            p.style.left = (Math.random() * 100) + "vw";
            p.style.animationDelay = Math.floor(Math.random() * 300) + "ms";
            p.style.fontSize = (16 + Math.floor(Math.random() * 10)) + "px";
            layer.appendChild(p);
            setTimeout(() => p.remove(), 2200);
        }
    }

    function animateLastStoneInPit(pitIndex) {
        const pit = document.getElementById('pit' + pitIndex);
        if (!pit) return;
        const stones = pit.querySelectorAll('.stone');
        if (!stones.length) return;
        const st = stones[stones.length - 1];
        st.classList.add('stone-pop');
        setTimeout(() => st.classList.remove('stone-pop'), 280);
    }

    function triggerTreasurySparkle(pitIndex) {
        if (pitIndex !== 6 && pitIndex !== 13) return;
        const pit = document.getElementById('pit' + pitIndex);
        if (!pit) return;
        const spark = document.createElement('div');
        spark.className = 'treasury-sparkle';
        spark.innerText = "✨";
        pit.appendChild(spark);
        setTimeout(() => spark.remove(), 700);
    }

    function getResultIcon(message, type = "info") {
        if (type === "win") return "🏆";
        if (type === "draw") return "🤝";
        if (type === "leave") return "🚪";
        if (type === "error") return "⚠️";
        if (message.includes("Berabere")) return "🤝";
        if (message.includes("kazandı")) return "🏆";
        if (message.includes("çıktı")) return "🚪";
        return "ℹ️";
    }

    function showResultBox(message, opts = {}) {
        const autoCloseMs = typeof opts.autoCloseMs === "number" ? opts.autoCloseMs : 2200;
        const type = opts.type || "info";
        const withActions = !!opts.withActions;
        const overlay = document.getElementById('result-overlay');
        const icon = document.getElementById('result-icon');
        const text = document.getElementById('result-text');
        const actions = document.getElementById('result-actions');
        const replayBtn = document.getElementById('result-replay-btn');
        const menuBtn = document.getElementById('result-menu-btn');
        if (!overlay || !text || !icon || !actions || !replayBtn || !menuBtn) return Promise.resolve(null);
        if (resultBoxTimer) { clearTimeout(resultBoxTimer); resultBoxTimer = null; }
        if (resultBoxResolver) { resultBoxResolver(null); resultBoxResolver = null; }
        icon.innerText = getResultIcon(message, type);
        text.innerText = message;
        actions.style.display = withActions ? 'flex' : 'none';
        overlay.style.display = 'flex';
        return new Promise(resolve => {
            resultBoxResolver = resolve;
            replayBtn.onclick = () => {
                overlay.style.display = 'none';
                resultBoxResolver = null;
                resolve("replay");
            };
            menuBtn.onclick = () => {
                overlay.style.display = 'none';
                resultBoxResolver = null;
                resolve("menu");
            };
            if (!withActions) {
                resultBoxTimer = setTimeout(() => {
                    overlay.style.display = 'none';
                    resultBoxTimer = null;
                    resultBoxResolver = null;
                    resolve(null);
                }, autoCloseMs);
            }
        });
    }

    async function loadStudents() { 
        try { 
            const select = document.getElementById('student-list'); 
            const snapshot = await db.collection('ogrenciler').get(); 
            select.innerHTML = '<option value="">İsmini Seç...</option>';
            snapshot.forEach(doc => { 
                studentsData[doc.id] = doc.data(); 
                let opt = document.createElement('option'); 
                opt.value = doc.id; opt.textContent = doc.data().ad_soyad; 
                select.appendChild(opt); 
            });
        } catch (e) { console.error(e); } 
    }
    loadStudents();

    const presenceRef = rtdb.ref('presence_sessions/' + sessionId);
    function updatePresenceState(state) {
        const payload = {
            active: true,
            ts: Date.now(),
            state: state || "auth",
            userId: currentUser ? currentUser.id : "",
            userName: currentUser ? currentUser.ad_soyad : ""
        };
        presenceRef.set(payload).catch(() => {});
    }
    updatePresenceState("auth");
    presenceRef.onDisconnect().remove();
    rtdb.ref('presence_sessions').on('value', snap => {
        const val = snap.exists() ? snap.val() : {};
        lastPresenceSnapshot = val;
        const count = val ? Object.keys(val).length : 0;
        const el = document.getElementById('online-count-value');
        if (el) el.innerText = String(count);
        updateTeacherPanelFromPresence(val);
    });
    rtdb.ref('rooms').on('value', snap => {
        const rooms = snap.exists() ? Object.values(snap.val()) : [];
        let playing = 0;
        let finished = 0;
        rooms.forEach(r => {
            if (!r || !r.p1 || !r.p2) return;
            if (r.gameOver) finished++;
            else playing++;
        });
        const playingEl = document.getElementById('tm-playing');
        const finishedEl = document.getElementById('tm-finished');
        if (playingEl) playingEl.innerText = String(playing);
        if (finishedEl) finishedEl.innerText = String(finished);
    });

    function showStudentScores() { 
        const id = document.getElementById('student-list').value; 
        const box = document.getElementById('student-info-box'); 
        if (id && studentsData[id]) { 
            document.getElementById('info-ai').innerText = studentsData[id].skor_ai || 0; 
            document.getElementById('info-online').innerText = studentsData[id].skor_online || 0; 
            box.style.display = 'block'; 
        } else box.style.display = 'none';
    }

    async function handleLogin() { 
        const id = document.getElementById('student-list').value; 
        const pass = document.getElementById('password').value;
        if (!id || studentsData[id].sifre !== pass) return alert("Hatalı!"); 
        currentUser = { id, ...studentsData[id] }; 
        updatePresenceState("lobby");
        document.getElementById('auth-overlay').style.display = 'none'; 
        document.getElementById('lobby-selection').style.display = 'flex';
        document.getElementById('display-name').innerText = currentUser.ad_soyad; 
        showOnboardingIfNeeded();
    }

    function returnToLobbyUI() {
        board = [4, 4, 4, 4, 4, 4, 0, 4, 4, 4, 4, 4, 4, 0];
        isPlayer1Turn = true;
        opponentName = "Bilgisayar";
        myRole = "";
        currentRoomRef = null;
        gameMode = "";
        isAnimating = false;
        isHandActive = false;
        gameFinished = false;
        lastProcessedMoveTs = 0;
        turnStartedAt = 0;
        matchStats = null;

        const overlay = document.getElementById('result-overlay');
        if (overlay) overlay.style.display = 'none';
        const actions = document.getElementById('result-actions');
        if (actions) actions.style.display = 'none';
        const waiting = document.getElementById('waiting-screen');
        if (waiting) waiting.style.display = 'none';
        const gameUI = document.getElementById('game-ui');
        if (gameUI) gameUI.style.display = 'none';
        const lobby = document.getElementById('lobby-selection');
        if (lobby) lobby.style.display = 'flex';
        document.body.classList.remove('game-active');
        updateUI();
        updateUserLabel();
        updatePresenceState("lobby");
    }

    async function forceReset() { 
        if (typeof currentRoomRef !== 'undefined' && currentRoomRef !== null) {
            currentRoomRef.off();
            if (gameMode === "ONLINE" && myRole && !gameFinished) {
                try {
                    const roomKey = currentRoomRef.key;
                    await currentRoomRef.update({
                        [myRole]: "",
                        leftBy: myRole,
                        leftReason: "quit",
                        leftAt: Date.now()
                    });
                    if (myRole === "p1" && roomKey) {
                        const lobbyRef = rtdb.ref('lobby');
                        await lobbyRef.transaction(cur => (cur === roomKey ? null : cur));
                    }
                } catch (e) { console.error(e); }
            }
        }
        if (!currentUser) {
            window.location.replace(window.location.pathname);
            return;
        }
        returnToLobbyUI();
    }

    async function startOnlineMode() {
        gameMode = "ONLINE";
        resetMatchStats();
        updatePresenceState("matching");
        document.getElementById('lobby-selection').style.display = 'none';
        document.getElementById('waiting-screen').style.display = 'flex';
        const lobbyRef = rtdb.ref('lobby');
        const maxRetries = 25;
        const retryDelayMs = 250;

        for (let attempt = 0; attempt < maxRetries; attempt++) {
            const lobbySnap = await lobbyRef.get();
            const lobbyVal = lobbySnap.val();

            if (!lobbyVal) {
                const lock = { type: "lock", owner: sessionId, ts: Date.now() };
                const lockResult = await lobbyRef.transaction(cur => (cur === null ? lock : cur));
                if (!lockResult.committed) {
                    await new Promise(r => setTimeout(r, retryDelayMs));
                    continue;
                }

                try {
                    const newRoomRef = rtdb.ref('rooms').push();
                    myRole = "p1";
                    currentRoomRef = newRoomRef;
                    await newRoomRef.set({
                        p1: currentUser.ad_soyad,
                        p2: "",
                        board: board,
                        turn: "p1",
                        lastMove: -1,
                        lastPlayer: "",
                        ts: 0,
                        gameOver: false,
                        winnerText: "",
                        leftBy: "",
                        leftReason: "",
                        leftAt: 0
                    });
                    await lobbyRef.set(newRoomRef.key);
                    newRoomRef.on('value', snap => {
                        const v = snap.val();
                        if (v && v.p2 !== "" && !isHandActive) showVSScreen(v);
                        if (v && isHandActive && !v.gameOver && v.leftBy === "p2" && v.leftReason === "quit") handleOpponentLeft();
                    });
                    return;
                } catch (e) {
                    console.error(e);
                    await lobbyRef.transaction(cur => (
                        cur && cur.type === "lock" && cur.owner === sessionId ? null : cur
                    ));
                    throw e;
                }
            }

            if (typeof lobbyVal === "string") {
                const roomId = lobbyVal;
                const roomRef = rtdb.ref('rooms/' + roomId);
                const joinResult = await roomRef.transaction(room => {
                    if (!room) return room;
                    if (!room.p1 || room.p1 === "") return room;
                    if (room.p2 && room.p2 !== "") return;
                    room.p2 = currentUser.ad_soyad;
                    return room;
                });

                const joinedRoom = joinResult.snapshot && joinResult.snapshot.val ? joinResult.snapshot.val() : null;
                const joinedOk = !!(joinResult.committed && joinedRoom && joinedRoom.p2 === currentUser.ad_soyad);
                if (joinedOk) {
                    myRole = "p2";
                    currentRoomRef = roomRef;
                    await lobbyRef.transaction(cur => (cur === roomId ? null : cur));
                    showVSScreen(joinedRoom);
                    currentRoomRef.on('value', snap => {
                        const v = snap.val();
                        if (v && isHandActive && !v.gameOver && v.leftBy === "p1" && v.leftReason === "quit") handleOpponentLeft();
                    });
                    return;
                }

                await lobbyRef.transaction(cur => (cur === roomId ? null : cur));
                await new Promise(r => setTimeout(r, retryDelayMs));
                continue;
            }

            if (lobbyVal && lobbyVal.type === "lock") {
                const lockAge = Date.now() - (lobbyVal.ts || 0);
                if (lockAge > 8000) {
                    await lobbyRef.transaction(cur => {
                        if (!cur || cur.type !== "lock") return cur;
                        const curAge = Date.now() - (cur.ts || 0);
                        if (curAge > 8000) return { type: "lock", owner: sessionId, ts: Date.now() };
                        return cur;
                    });
                }
                await new Promise(r => setTimeout(r, retryDelayMs));
                continue;
            }

            await new Promise(r => setTimeout(r, retryDelayMs));
        }

        await showResultBox("Eslestirme su an yapilamadi. Lutfen tekrar dene.", { type: "error", autoCloseMs: 2200 });
        await forceReset();
    }

    async function handleOpponentLeft() {
        if (!isHandActive || gameFinished) return;
        gameFinished = true;
        currentRoomRef.off(); isAnimating = true;
        await showResultBox("Rakip oyundan cikti. Skor kaydediliyor.", { type: "leave", autoCloseMs: 2200 });
        try {
            const userRef = db.collection('ogrenciler').doc(currentUser.id);
            const docSnap = await userRef.get();
            const yeniSkor = (docSnap.data()["skor_online"] || 0) + board[6];
            await userRef.update({ ["skor_online"]: yeniSkor });
            currentUser.skor_online = yeniSkor;
        } catch (e) { console.error(e); }
        await forceReset();
    }

    function showVSScreen(data) {
        document.getElementById('waiting-screen').style.display = 'none';
        const vsDiv = document.getElementById('vs-screen');
        document.getElementById('p1-vs').innerText = data.p1;
        document.getElementById('p2-vs').innerText = data.p2;
        vsDiv.style.display = 'flex';
        setTimeout(() => { vsDiv.style.display = 'none'; setupUI(data); }, 6000);
    }

    function setupUI(data) {
        isHandActive = true;
        updatePresenceState("in_match");
        if (!matchStats) resetMatchStats();
        document.getElementById('game-ui').style.display = 'flex'; 
        document.body.classList.add('game-active');
        opponentName = (myRole === "p1" ? data.p2 : data.p1);
        document.getElementById('opponent-label').innerText = "Rakip: " + opponentName;
        updateUserLabel();
        currentRoomRef.on('value', async snap => {
            const val = snap.val(); if(!val) return;
            if (val.gameOver) {
                if (!gameFinished) {
                    gameFinished = true;
                    isAnimating = true;
                    board = [...val.board];
                    isPlayer1Turn = (val.turn === "p1");
                    updateUI();
                    const isDraw = !!(val.winnerText && val.winnerText.includes("Berabere"));
                    playEndJingle(isDraw);
                    createFxBurst(isDraw ? "draw" : "win");
                    if (val.winnerText) {
                        const summaryText = val.summaryText ? ("\n\n" + val.summaryText) : "";
                        const choice = await showResultBox("Bitti! " + val.winnerText + summaryText, {
                            type: isDraw ? "draw" : "win",
                            withActions: true
                        });
                        if (choice === "replay" && gameMode === "AI") {
                            board = [4, 4, 4, 4, 4, 4, 0, 4, 4, 4, 4, 4, 4, 0];
                            isPlayer1Turn = true;
                            isAnimating = false;
                            gameFinished = false;
                            resetMatchStats();
                            updatePresenceState("ai_match");
                            updateUI();
                            return;
                        }
                    }
                    await forceReset();
                }
                return;
            }
            if (val.lastPlayer !== "" && val.lastPlayer !== myRole && val.ts > lastProcessedMoveTs) { 
                lastProcessedMoveTs = val.ts; await play(val.lastMove); 
            }
            if (!isAnimating) { board = [...val.board]; isPlayer1Turn = (val.turn === "p1"); updateUI(); }
        });
    }

    function startGame(mode) { 
        gameMode = mode; isHandActive = true;
        resetMatchStats();
        updatePresenceState(mode === "AI" ? "ai_match" : "in_match");
        opponentName = (mode === "AI" ? "Bilgisayar" : "Rakip"); 
        document.getElementById('lobby-selection').style.display = 'none'; 
        document.getElementById('game-ui').style.display = 'flex'; 
        document.body.classList.add('game-active');
        document.getElementById('opponent-label').innerText = "Rakip: " + opponentName; 
        updateUserLabel();
        updateUI();
    }

    function updateUI() {
        const ind = document.getElementById('turn-indicator');
        const p1Name = (gameMode === "ONLINE" && myRole === "p2") ? opponentName : currentUser.ad_soyad;
        const p2Name = (gameMode === "ONLINE" && myRole === "p2") ? currentUser.ad_soyad : opponentName;
        ind.innerText = isPlayer1Turn ? `Sıra: ${p1Name}` : `Sıra: ${p2Name}`;

        for (let i = 0; i < 14; i++) {
            const p = document.getElementById('pit' + i);
            p.innerHTML = "";
            for (let s = 0; s < board[i]; s++) { 
                const st = document.createElement('div'); st.className = 'stone'; p.appendChild(st); 
            }
            const c = document.createElement('div');
            if (i === 6 || i === 13) c.className = 'stone-count count-treasury';
            else if (i >= 7 && i <= 12) c.className = 'stone-count count-top'; 
            else c.className = 'stone-count count-bottom';
            c.innerText = board[i]; p.appendChild(c);
            
            p.classList.remove('active-pit');
            if(!isAnimating) {
                if(isPlayer1Turn && i <= 5) p.classList.add('active-pit');
                if(!isPlayer1Turn && i >= 7 && i <= 12) p.classList.add('active-pit');
            }
        }
    }

    async function handlePitClick(i) { 
        if (isAnimating || board[i] === 0) return;
        if (gameMode === "ONLINE" && ((myRole === "p1" && !isPlayer1Turn) || (myRole === "p2" && isPlayer1Turn))) return;

        // HAMLE SINIRLAMA KONTROLÜ 
        if (isPlayer1Turn && (i < 0 || i > 5)) return;
        if (!isPlayer1Turn && (i < 7 || i > 12)) return;

        await play(i);
        if (gameMode === "ONLINE") {
            await currentRoomRef.update({ board: board, turn: isPlayer1Turn ? "p1" : "p2", lastMove: i, lastPlayer: myRole, ts: Date.now() });
        }
        if (gameMode === "AI" && !isPlayer1Turn) { 
            await new Promise(r => setTimeout(r, 1000)); aiMove();
        } 
    }

    async function play(index) { 
        const moverWasP1 = isPlayer1Turn;
        const names = getPlayerNames();
        const moverName = moverWasP1 ? names.p1Name : names.p2Name;
        const beforeTreasury = moverWasP1 ? board[6] : board[13];
        isAnimating = true; let stones = board[index]; board[index] = 0;
        clickSound.currentTime = 0; clickSound.play().catch(()=>{}); 
        updateUI(); await new Promise(r => setTimeout(r, 400)); 
        let cur = index;
        if (stones === 1) { 
            cur = (cur + 1) % 14; board[cur]++; updateUI(); animateLastStoneInPit(cur); triggerTreasurySparkle(cur); await new Promise(r => setTimeout(r, 400));
        } else { 
            board[index] = 1; stones--; updateUI(); await new Promise(r => setTimeout(r, 400));
            while (stones > 0) { 
                cur = (cur + 1) % 14; 
                if (isPlayer1Turn && cur === 13) continue;
                if (!isPlayer1Turn && cur === 6) continue; 
                board[cur]++; stones--; 
                clickSound.currentTime = 0; clickSound.play().catch(()=>{}); 
                updateUI(); animateLastStoneInPit(cur); triggerTreasurySparkle(cur); await new Promise(r => setTimeout(r, 400));
            } 
        } 
        const afterTreasury = moverWasP1 ? board[6] : board[13];
        recordMoveStats(moverName, Math.max(0, afterTreasury - beforeTreasury));
        checkRules(cur); isAnimating = false; await checkGameOver(); updateUI(); 
    }

    function checkRules(last) { 
        if ((isPlayer1Turn && last === 6) || (!isPlayer1Turn && last === 13)) return;
        if (isPlayer1Turn && last >= 7 && last <= 12 && board[last] % 2 === 0) { 
            board[6] += board[last]; board[last] = 0; 
        } else if (!isPlayer1Turn && last >= 0 && last <= 5 && board[last] % 2 === 0) { 
            board[13] += board[last]; board[last] = 0; 
        } 
        if (board[last] === 1) { 
            let opp = 12 - last;
            if (isPlayer1Turn && last <= 5 && board[opp] > 0) { 
                board[6] += board[last] + board[opp]; board[last] = 0; board[opp] = 0; 
            } else if (!isPlayer1Turn && last >= 7 && last <= 12 && board[opp] > 0) { 
                board[13] += board[last] + board[opp]; board[last] = 0; board[opp] = 0; 
            } 
        } 
        isPlayer1Turn = !isPlayer1Turn;
        playTurnDing();
    }

    function aiMove() { 
        let m = []; for(let i=7; i<=12; i++) if(board[i]>0) m.push(i); 
        if(m.length) handlePitClick(m[Math.floor(Math.random()*m.length)]);
    }

    async function checkGameOver() { 
        if (board.slice(0, 6).every(v => v === 0) || board.slice(7, 13).every(v => v === 0)) { 
            gameFinished = true;
            isAnimating = true;
            for (let i = 0; i < 6; i++) { board[6] += board[i]; board[i] = 0; } 
            for (let i = 7; i < 13; i++) { board[13] += board[i]; board[i] = 0; } 
            updateUI();
            const p1Name = (gameMode === "ONLINE" && myRole === "p2") ? opponentName : currentUser.ad_soyad;
            const p2Name = (gameMode === "ONLINE" && myRole === "p2") ? currentUser.ad_soyad : opponentName;
            let winnerText = "Berabere";
            if (board[6] > board[13]) winnerText = p1Name + " kazandı";
            else if (board[13] > board[6]) winnerText = p2Name + " kazandı";
            const isDraw = winnerText.includes("Berabere");
            const summaryText = buildMatchSummary(winnerText);
            updatePresenceState("finished");
            if (gameMode === "ONLINE" && currentRoomRef) {
                try {
                    await currentRoomRef.update({
                        board: board,
                        turn: isPlayer1Turn ? "p1" : "p2",
                        gameOver: true,
                        winnerText: winnerText,
                        summaryText: summaryText,
                        ts: Date.now()
                    });
                } catch (e) { console.error(e); }
            }
            const f = (gameMode === "AI") ? "skor_ai" : "skor_online"; 
            try { 
                const userRef = db.collection('ogrenciler').doc(currentUser.id);
                const docSnap = await userRef.get(); 
                const yeniSkor = (docSnap.data()[f] || 0) + board[6]; 
                await userRef.update({ [f]: yeniSkor });
                currentUser[f] = yeniSkor;
                playEndJingle(isDraw);
                createFxBurst(isDraw ? "draw" : "win");
                const choice = await showResultBox("Bitti! " + winnerText + " | Skor: " + yeniSkor + "\n\n" + summaryText, {
                    type: isDraw ? "draw" : "win",
                    withActions: true
                });
                if (choice === "replay" && gameMode === "AI") {
                    board = [4, 4, 4, 4, 4, 4, 0, 4, 4, 4, 4, 4, 4, 0];
                    isPlayer1Turn = true;
                    isAnimating = false;
                    gameFinished = false;
                    resetMatchStats();
                    updatePresenceState("ai_match");
                    updateUserLabel();
                    updateUI();
                    return;
                }
                await forceReset(); 
            } catch (e) { console.error(e); await forceReset(); } 
        } 
    }
</script>
